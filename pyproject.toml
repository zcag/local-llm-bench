[project]
name = "llm-bench"
version = "0.1.0"
description = "End-to-end benchmark of the local LLM stack on tardis (engine x model x harness)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "psutil>=6.0",
    "transformers>=4.44",   # exact output-token counting via the served tokenizer
    "rich>=13.0",
    "evalplus>=0.3.1",      # HumanEval+/MBPP+ harness (L1 coding correctness)
    "pytest>=8.0",          # L2 polyglot task grading
]

[tool.uv]
package = false
